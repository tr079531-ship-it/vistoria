<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Cadastro de Vistoria</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


<style>

body{
    background:#f4f6f9;
}

.card{
    border:none;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.preview-foto{
    margin-top:10px;
    margin-bottom:15px;
}

.preview-foto img{
    max-width:250px;
    max-height:250px;
    border-radius:8px;
    border:1px solid #ddd;
    padding:3px;
    background:white;
}

</style>

</head>

<body>

<div class="container mt-4">

    <div class="card">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">
                Cadastro de Vistoria
            </h3>

        </div>

        <div class="card-body">

            <div class="mb-3">

                <label class="form-label">
                    Defeito
                </label>

                <input
                    type="text"
                    id="defeito"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Técnico
                </label>

                <input
                    type="text"
                    id="tecnico"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Endereço
                </label>

                <input
                    type="text"
                    id="endereco"
                    class="form-control">

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Descrição
                </label>

                <textarea
                    id="descricao"
                    class="form-control"
                    rows="4"></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Causa Raiz
                </label>

                <textarea
                    id="causaRaiz"
                    class="form-control"
                    rows="4"></textarea>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Foto 1
                </label>

                <input
                    type="file"
                    id="foto1"
                    accept="image/*"
                    class="form-control">

                <div
                    id="preview1"
                    class="preview-foto">
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Foto 2
                </label>

                <input
                    type="file"
                    id="foto2"
                    accept="image/*"
                    class="form-control">

                <div
                    id="preview2"
                    class="preview-foto">
                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Foto 3
                </label>

                <input
                    type="file"
                    id="foto3"
                    accept="image/*"
                    class="form-control">

                <div
                    id="preview3"
                    class="preview-foto">
                </div>

            </div>

            <button
                class="btn btn-primary btn-lg w-100"
                onclick="enviar()">

                Salvar Vistoria

            </button>

        </div>

    </div>

</div>

<script>
const URL_FLOW =
"https://default9744600e3e04492ebaa125ec245c6f.10.environment.api.powerplatform.com/powerautomate/automations/direct/workflows/08b6d9f6e11f4e75b8e09e847ca0ef18/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=ROaiVVjGQtnOJ-3CyOSzDVR9hSSNFPSHFhRDzkyJ8G4";

async function comprimirImagem(file){

    if(!file) return "";

    return new Promise((resolve)=>{

        const reader = new FileReader();

        reader.onload = (e)=>{

            const img = new Image();

            img.src = e.target.result;

            img.onload = ()=>{

                let largura = img.width;
                let altura = img.height;

                const larguraMaxima = 800;

                if(largura > larguraMaxima){

                    altura =
                        altura *
                        (larguraMaxima / largura);

                    largura =
                        larguraMaxima;

                }

                const canvas =
                    document.createElement("canvas");

                canvas.width = largura;
                canvas.height = altura;

                const ctx =
                    canvas.getContext("2d");

                ctx.drawImage(
                    img,
                    0,
                    0,
                    largura,
                    altura
                );

                const base64 =
                    canvas.toDataURL(
                        "image/jpeg",
                        0.5
                    );

                resolve(base64);

            };

        };

        reader.readAsDataURL(file);

    });

}

function previewImagem(evento){

    const input = evento.target;

    const numero =
        input.id.replace("foto","");

    const preview =
        document.getElementById(
            "preview" + numero
        );

    preview.innerHTML = "";

    if(input.files.length > 0){

        const img =
            document.createElement("img");

        img.src =
            URL.createObjectURL(
                input.files[0]
            );

        preview.appendChild(img);

    }

}
document
.getElementById("foto1")
.addEventListener(
    "change",
    previewImagem
);

document
.getElementById("foto2")
.addEventListener(
    "change",
    previewImagem
);

document
.getElementById("foto3")
.addEventListener(
    "change",
    previewImagem
);

async function enviar(){

    try{

        const foto1 =
        await comprimirImagem(
            document
            .getElementById("foto1")
            .files[0]
        );

        const foto2 =
        await comprimirImagem(
            document
            .getElementById("foto2")
            .files[0]
        );

        const foto3 =
        await comprimirImagem(
            document
            .getElementById("foto3")
            .files[0]
        );

        const dados = {

            defeito:
            document.getElementById("defeito").value,

            tecnico:
            document.getElementById("tecnico").value,

            endereco:
            document.getElementById("endereco").value,

            descricao:
            document.getElementById("descricao").value,

            causaRaiz:
            document.getElementById("causaRaiz").value,

            foto1: foto1,
            foto2: foto2,
            foto3: foto3,

            status: "VISTORIADO",

            data:
            new Date().toISOString()

        };

        const resposta =
        await fetch(
            URL_FLOW,
            {
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify(dados)
            }
        );

        if(resposta.ok){

            alert(
                "Vistoria enviada com sucesso!"
            );

            location.reload();

        }
        else{

            alert(
                "Erro ao enviar vistoria."
            );

        }

    }
    catch(erro){

        console.error(erro);

        alert(
            "Falha na comunicação."
        );

    }

}

</script>

</body>
</html>
